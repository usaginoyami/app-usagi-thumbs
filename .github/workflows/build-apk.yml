name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Testes da lógica
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Gerar APK (debug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: usagi-thumb-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk usagi-thumb-debug.apk
          gh release create "build-${{ github.run_number }}" usagi-thumb-debug.apk \
            --prerelease --title "Build ${{ github.run_number }}" \
            --notes "APK debug gerado do commit ${{ github.sha }}"
