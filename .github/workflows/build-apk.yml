name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Testes da lógica
        run: |
          set +e
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |^w: .*(error)|FAILED|What went wrong|Could not|Test.*>|Assertion|Exception" -A2 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Falha nos testes/compilacao::$msg"
          fi
          exit $code
      - name: Gerar APK (debug)
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build2.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |FAILED|What went wrong|Could not|Exception" -A2 build2.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Falha no APK::$msg"
          fi
          exit $code
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: usagi-thumb-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK numa release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk usagi-thumb-debug.apk
          gh release create "build-${{ github.run_number }}" usagi-thumb-debug.apk \
            --prerelease --title "Build ${{ github.run_number }}" \
            --notes "APK debug gerado do commit ${{ github.sha }}"
